<!DOCTYPE html>
<html lang="en" data-theme="valentine">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taylor Swift Albums</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Petit+Formal+Script&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1 class="text-center text-4xl font-bold font-Petit p-5">
      Taylor Swift Albums
    </h1>
    <div id="search-bar" class="text-center mx-auto p-2">
      <input
        id="searchbar"
        type="text"
        placeholder="Search albums.."
        required
      />
      <button
        class="btn btn-soft btn-secondary text-center mx-auto"
        type="submit"
        id="search-button"
      >
        Search
      </button>
    </div>
    <div
      class="justify-center mx-auto font-sans flex flex-wrap gap-4 p-auto m-3 sm:gap-6 md:gap-8 lg:max-w-[90%]"
      id="api-response"
    ></div>
    <!-- <h2 id="api-response"></h2> -->
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
